{% extends "base.html" %}
{% block content %}
<style>
  .result-page{ max-width: 640px; margin: 0 auto; padding: 48px 24px 60px; }
  .result-page .eyebrow{
    font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--lamp-green-deep); opacity: 0.75;
    display:flex; align-items:center; gap:8px;
    margin-bottom: 14px;
  }
  .result-page .eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background: var(--brass-bright); display:inline-block; }
  .result-page h1{ font-size: 30px; margin-bottom: 24px; }

  .detail-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 32px;
    box-shadow: 0 2px 10px rgba(27,38,33,0.05);
    font-size: 15.5px;
    line-height: 1.9;
    white-space: pre-line;
    color: var(--ink);
  }

  .back-link{
    display: inline-block;
    margin-top: 22px;
    color: var(--lamp-green-deep);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .back-link:hover{ text-decoration: underline; }
</style>

<div class="result-page">
  <div class="eyebrow">Reading room · Seat lookup</div>
  <h1>Seat {{ seat_number }}</h1>

  <div class="detail-card">{{ message }}</div>

  <a href="/check-seat" class="back-link">&larr; Check another seat</a>
</div>
{% endblock %}
