{% extends "base.html" %}
{% block content %}
<style>
  .form-page{ max-width: 640px; margin: 0 auto; padding: 48px 24px 60px; }
  .form-page .eyebrow{
    font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--lamp-green-deep); opacity: 0.75;
    display:flex; align-items:center; gap:8px;
    margin-bottom: 14px;
  }
  .form-page .eyebrow::before{ content:''; width:7px; height:7px; border-radius:50%; background: var(--brass-bright); display:inline-block; }
  .form-page h1{ font-size: 30px; margin-bottom: 8px; }
  .form-page .form-sub{ color: var(--ink-faint); font-size: 14.5px; margin-bottom: 30px; }

  .form-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 32px;
    box-shadow: 0 2px 10px rgba(27,38,33,0.05);
  }
  .form-card button{ width: 100%; margin-top: 6px; }
</style>

<div class="form-page">
  <div class="eyebrow">Reading room · Seat lookup</div>
  <h1>Check a seat</h1>
  <p class="form-sub">Enter a seat number to see who's booked it, and for which shift.</p>

  {% if message %}
    <div class="result-box">{{ message }}</div>
  {% endif %}

  <div class="form-card">
    <form method="POST" action="/check-seat">
      <label for="seat_number">Seat number</label>
      <input type="number" id="seat_number" name="seat_number" placeholder="e.g. 42" required>

      <button type="submit">Check seat</button>
    </form>
  </div>
</div>
{% endblock %}
